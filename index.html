:grid;gap:11px}.choice{background:transparent;border:1px solid var(--line);border-radius:12px;padding:15px 18px;text-align:left;color:var(--ink);display:flex;gap:15px;align-items:center}.choice:not(:disabled):hover{background:var(--sage);border-color:var(--tea)}.choice span{font-size:12px;width:27px;height:27px;display:grid;place-items:center;border:1px solid var(--line);border-radius:7px}.choice.correct{background:var(--sage);border-color:var(--tea)}.choice.incorrect{background:#f3e7e0;border-color:var(--danger)}.feedback{margin-top:20px;padding:20px;border-radius:14px;background:var(--sage)}.feedback h3{font-size:17px;margin-bottom:6px}.feedback p{font-size:15px;margin-bottom:0}.feedback:empty{display:none}.next-row{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:25px;flex-wrap:wrap}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.stat{background:var(--white);padding:26px;border:1px solid var(--line);border-radius:20px}.stat strong{display:block;font-size:40px;font-weight:550;letter-spacing:-1px;color:var(--tea)}.stat span{font-size:13px;color:var(--muted)}.stamp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stamp{border:1px dashed #b7bba7;border-radius:20px;padding:24px 12px;text-align:center;background:var(--white)}.stamp.earned{border:2px solid var(--tea);background:var(--sage)}.stamp .icon{margin:0 auto 14px}.stamp h3{font-size:15px;margin-bottom:5px}.stamp p{font-size:12px;color:var(--muted);margin:0}.note{background:var(--sage);border-radius:16px;padding:20px 23px;color:var(--tea-dark);font-size:14px;margin:25px 0}.empty{padding:45px;text-align:center;background:var(--white);border:1px solid var(--line);border-radius:20px}.text-link{background:none;border:0;color:var(--tea-dark);text-decoration:underline;font-size:13px;padding:7px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;background:var(--ink);color:white;border-radius:12px;font-size:14px;z-index:5;max-width:90vw}.skip{position:absolute;top:-100px;padding:12px;background:var(--white);z-index:10}.skip:focus{top:0}.tag{font-size:11px;font-weight:600;border-radius:20px;padding:5px 10px;background:var(--sage);color:var(--tea-dark)}.practice-warning{font-size:13px;color:var(--muted);margin-top:20px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.hero{gap:25px}.hero-art{height:310px}.floating.a{left:8px}.footer{margin:0 32px}.stamp-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.topbar{padding:17px 20px;flex-wrap:wrap;gap:14px}.brand{font-size:17px}.nav{width:100%;justify-content:space-between}.nav a{padding:8px 12px;font-size:12px}main{padding:25px 20px 45px}.hero{grid-template-columns:1fr;padding:20px 0 30px;gap:30px}h1{font-size:45px;letter-spacing:-1.7px}.hero-art{height:260px}.orbit{width:190px;height:190px}.orbit:before{width:260px;height:260px}.orb-core{width:135px;height:135px}.floating.a{top:23px;left:20px}.floating.b{bottom:20px}.grid{gap:12px}.card{padding:18px 15px}.card h3{font-size:17px}.card p{font-size:12px}.card-top{margin-bottom:16px}.icon{width:40px;height:40px;font-size:20px}.ribbon{gap:8px 18px;font-size:12px}.section-head{margin-top:30px}.section-head h2{font-size:25px}.section-head .subtle{display:none}.passport-banner{padding:25px;flex-direction:column;align-items:start}.footer{margin:0 20px;flex-direction:column;gap:9px}.station-hero{grid-template-columns:1fr}.station-hero h1{font-size:36px}.station-badge{display:none}.lesson-list{grid-template-columns:1fr}.reading,.question{padding:23px}.reading{font-size:17px}.learning-layout h1{font-size:34px}.stat-grid{gap:8px}.stat{padding:18px 12px}.stat strong{font-size:32px}.stat span{font-size:11px}.lesson-header{font-size:11px}.next-row{align-items:stretch}.next-row .btn{flex:1}.stamp{padding:20px 10px}}@media(prefers-reduced-motion:reduce){*{scroll const lesson = (title, concept, example, question, choices, answer, explanation) => ({title,concept,example,question,choices,answer,explanation});
const STATIONS = [
{id:'characters',number:'01',title:'Chinese, one character at a time',short:'Chinese basics',subject:'Chinese',level:'Beginner',icon:'Aa',description:'Meet everyday characters with pronunciation, meaning and friendly examples.',lessons:[
lesson('A person','人 · rén · person. Its shape can remind you of someone standing on two legs.','一个人 · yí ge rén · one person','What does 人 (rén) mean?',['Person','Mountain','Water'],0,'人 means person. The pronunciation is rén, with a rising tone.'),
lesson('The sun and the day','日 · rì · sun or day. The same character can refer to sunlight or a day.','生日 · shēngrì · birthday','Which meaning belongs to 日 (rì)?',['Tree','Sun or day','Mouth'],1,'日 can mean sun or day. In 生日, it is part of the word birthday.'),
lesson('A mountain','山 · shān · mountain. Notice the three upright strokes, like peaks.','火山 · huǒshān · volcano, literally fire mountain','Which character means mountain?',['人 · rén','水 · shuǐ','山 · shān'],2,'山 means mountain. 火 means fire, so 火山 is a volcano.'),
lesson('Water','水 · shuǐ · water. Look for water-related meaning in words containing it.','水果 · shuǐguǒ · fruit','How do you say 水 (water)?',['shuǐ','rì','rén'],0,'水 is pronounced shuǐ. Pinyin uses a tone mark to show the shape of your voice.'),
lesson('One, two, three','一 · yī · one; 二 · èr · two; 三 · sān · three. Count the horizontal strokes.','三个人 · sān ge rén · three people','Which character means two?',['三 · sān','二 · èr','一 · yī'],1,'二 has two horizontal strokes and means two.'),
lesson('A tree becomes a forest','木 · mù · tree or wood. 林 · lín · woods combines two tree shapes.','树林 · shùlín · woods','What idea do two 木 shapes suggest in 林?',['A river','A person','Woods'],2,'Combining tree shapes gives a clue to the meaning: 林 means woods.') ]},
{id:'classics',number:'02',title:'Small steps into the classics',short:'Classical Chinese',subject:'Chinese',level:'Guided reading',icon:'↳',description:'Read short classical phrases through clear English translations and context.',lessons:[
lesson('Learn and revisit','学而时习之 · xué ér shí xí zhī · learn and regularly practice what you learn. This phrase is from the Analects.','A short review tomorrow helps you remember today’s lesson.','Which action matches this phrase?',['Study once and never return','Review what you have learned','Only collect new books'],1,'习 includes practicing or reviewing. Learning grows through revisiting.'),
lesson('Ask questions','知之为知之，不知为不知 · zhī zhī wéi zhī zhī, bù zhī wéi bù zhī · acknowledge what you know and what you do not know.','Saying “I do not understand yet” can be a useful first step.','Which response shows this idea?',['Pretend to understand','Hide every question','Admit uncertainty and ask'],2,'Recognizing the limits of your knowledge helps you learn accurately.'),
lesson('Learning from others','三人行，必有我师焉 · sān rén xíng, bì yǒu wǒ shī yān · among companions, there is someone I can learn from.','A classmate may explain a problem in a way you have not tried.','What is the main idea?',['You can learn from others','Only adults can teach','Always copy your friends'],0,'The phrase encourages noticing useful qualities and lessons in other people.'),
lesson('Review and discover','温故而知新 · wēn gù ér zhī xīn · review the old and understand something new.','Rereading a story can reveal a detail you missed.','What might reviewing an old lesson do?',['Make learning impossible','Reveal a new connection','Erase your memory'],1,'Familiar material can become clearer when you connect it with new knowledge.'),
lesson('A useful question word','何 · hé · what or why, depending on context. Classical Chinese often uses short expressions.','何人 · hé rén · what person, or who','What does 何人 (hé rén) ask?',['When?','How many?','Who?'],2,'何 asks what, and 人 means person. Together they ask who.'),
lesson('Words change with context','之 · zhī · a common classical word. It may refer to something already mentioned or connect words.','In 学而时习之, 之 refers back to what is learned.','In the learning phrase, what does 之 refer to?',['What you learn','A mountain','A date'],0,'Use the surrounding phrase to understand 之. One word does not always have one fixed English translation.') ]},
{id:'stories',number:'03',title:'Meet the writers',short:'Writer stories',subject:'Reading',level:'Short reads',icon:'“ ”',description:'Discover writers through short English profiles and reading questions.',lessons:[
lesson('Li Bai: imagination','Li Bai (李白 · Lǐ Bái, 701–762) was a Tang-dynasty poet. His poetry often explores friendship, travel and striking imagined scenes.','A writer may use a bold image to make a feeling vivid.','Which description fits Li Bai?',['A modern astronaut','A Tang poet','A Roman emperor'],1,'Li Bai is one of the best-known poets of China’s Tang dynasty.'),
lesson('Du Fu: noticing the world','Du Fu (杜甫 · Dù Fǔ, 712–770) wrote about family, hardship and the effects of conflict on ordinary people.','A poem can help readers notice the lives of people around them.','Which topic fits this profile?',['Only recipes','Only board games','How conflict affects people'],2,'Du Fu’s work frequently responds to personal and social hardship.'),
lesson('Li Qingzhao: a lyrical voice','Li Qingzhao (李清照 · Lǐ Qīngzhào, 1084–c.1155) is known for ci poetry: lyrics written to established tune patterns.','A tune pattern guides the shape of a ci lyric.','What form is she especially known for?',['Ci poetry','Science manuals','Comic strips'],0,'Li Qingzhao is a major writer of ci lyrics in the Song tradition.'),
lesson('Su Shi: many ways to create','Su Shi (苏轼 · Sū Shì, 1037–1101) was a Song-dynasty writer, poet and calligrapher. He is also known as Su Dongpo.','One person can explore several creative forms.','Which is another name for Su Shi?',['Li Bai','Su Dongpo','Du Fu'],1,'Su Dongpo is another name used for Su Shi.'),
lesson('Tao Yuanming: a quieter life','Tao Yuanming (陶渊明 · Táo Yuānmíng, c.365–427) is associated with poetry about rural life and a preference for simplicity.','A garden or a field can become the setting for reflection.','Which setting best matches this profile?',['A space station','A busy airport','A rural garden'],2,'Rural scenes and a simpler way of living are recurring associations with Tao Yuanming.'),
lesson('Read with evidence','A profile says: “The writer describes rain on the window, an empty room, and a friend far away.” These details may suggest loneliness.','An interpretation should connect to details in the text.','Which detail best supports loneliness?',['A friend far away','The writer uses ink','The paper is white'],0,'A friend’s absence supports the interpretation more directly than the writing materials.') ]},
{id:'roots',number:'04',title:'How characters are built',short:'Character roots',subject:'Chinese',level:'Explore patterns',icon:'⿰',description:'Explore the six traditional character categories with English explanations.',lessons:[
lesson('Pictographs','象形 · xiàngxíng · pictographs. Some early character forms were stylized pictures of things.','山 · shān · mountain: a shape suggesting peaks.','Which is the key idea of a pictograph?',['A spelling mistake','A stylized picture','A rhyme'],1,'A pictograph represents something through a stylized visual form.'),
lesson('Simple indicators','指事 · zhǐshì · simple indicators. Marks can point to an abstract idea, such as position.','上 · shàng · above; 下 · xià · below.','Which pair expresses position?',['Sun and moon','Tree and forest','Above and below'],2,'上 and 下 are traditional examples of indicating relative position.'),
lesson('Combined meaning','会意 · huìyì · combined meaning. Parts can work together to suggest an idea.','休 · xiū · rest: traditionally explained as a person beside a tree.','What does 休 (xiū) mean?',['Rest','Run','Count'],0,'The traditional explanation links a person and a tree with resting.'),
lesson('Meaning and sound','形声 · xíngshēng · semantic-phonetic characters. One part often hints at meaning; another relates to pronunciation.','河 · hé · river: 氵 hints at water; 可 relates to sound.','What does 氵 usually suggest?',['Fire','Water','Metal'],1,'The three-dot water component often appears in water-related characters.'),
lesson('Borrowed characters','假借 · jiǎjiè · phonetic borrowing. A written form may be borrowed to write another word with a similar sound.','This is a historical writing process, not an instruction to pronounce all similar shapes alike.','What enables phonetic borrowing?',['Matching colors','Matching page sizes','A similar sound'],2,'Phonetic borrowing uses a character for another word on the basis of sound.'),
lesson('A debated category','转注 · zhuǎnzhù · a traditional category whose exact definition is debated by scholars. The six categories do not all describe simple picture-building rules.','Historical classifications can have uncertain boundaries.','Which is the most accurate statement?',['Its definition is debated','Every category is a picture','Scholars never disagree'],0,'It is more accurate to acknowledge disagreement than invent a single certain rule for 转注.') ]},
{id:'words',number:'05',title:'Words you can use',short:'English vocabulary',subject:'English',level:'Everyday words',icon:'ab',description:'Build useful vocabulary through situations, word parts and context clues.',lessons:[
lesson('Observe','To observe means to watch or notice carefully. Scientists observe changes and record what they see.','“Observe the plant each morning.”','Which action is observing?',['Ignoring the plant','Looking carefully at new leaves','Guessing without looking'],1,'Observing involves careful attention to what is actually happening.'),
lesson('Compare','To compare is to look for similarities and differences.','“Compare the two leaves: one is wider.”','What does comparing help you find?',['Only names','Only dates','Similarities and differences'],2,'Comparison considers both what is alike and what is different.'),
lesson('Predict','To predict is to say what you think will happen, using clues or what you already know.','“Dark clouds are arriving. I predict rain.”','Which is a prediction?',['It may rain soon','It rained yesterday','Rain is water'],0,'A prediction is about what may happen, rather than a report of the past.'),
lesson('A helpful prefix','The prefix re- often means again, as in reread or rewrite. Not every word beginning with re uses this prefix.','“Please reread the question.”','What does reread mean?',['Read backward','Read again','Stop reading'],1,'Re- adds the meaning again to read.'),
lesson('Use context','“The trail was narrow, so we walked in a single line.” The second part helps explain narrow.','Context gives clues to an unfamiliar word.','What does narrow mean here?',['Very noisy','Very long','Not wide'],2,'Walking in a single line suggests there is little width on the trail.'),
lesson('Choose a precise word','“The ice melted” is more precise than “the ice changed.” Melt means to become liquid from a solid.','Precise words make explanations clearer.','Which word describes solid ice becoming water?',['Melt','Freeze','Grow'],0,'Melting changes a solid into a liquid.') ]},
{id:'math',number:'06',title:'Make sense of mathematics',short:'Math bridge',subject:'Math',level:'Foundation skills',icon:'＋',description:'Practice fractions, ratios and early algebra with worked English examples.',lessons:[
lesson('Equivalent fractions','Multiplying the top and bottom of a fraction by the same nonzero number keeps its value.','1/2 = (1 × 2)/(2 × 2) = 2/4','Which fraction equals 1/2?',['1/4','2/4','3/4'],1,'2/4 represents two of four equal parts, the same amount as one half.'),
lesson('Add unlike fractions','Use a common denominator before adding fractions.','1/2 + 1/4 = 2/4 + 1/4 = 3/4','What is 1/3 + 1/6?',['2/9','1/6','1/2'],2,'1/3 is 2/6. Add 2/6 + 1/6 = 3/6, which simplifies to 1/2.'),
lesson('Percent means per hundred','25% means 25 out of 100, which is one quarter.','25% of 20 = 20 ÷ 4 = 5','What is 10% of 80?',['8','10','18'],0,'10% is one tenth. 80 divided by 10 is 8.'),
lesson('Keep ratios in balance','A ratio of 2 red beads to 3 blue beads can be scaled by multiplying both quantities equally.','Doubling 2:3 gives 4:6.','If there are 4 red beads in a 2:3 ratio, how many are blue?',['3','6','8'],1,'The red amount doubled from 2 to 4, so blue doubles from 3 to 6.'),
lesson('Solve a simple equation','Keep an equation balanced by doing the same operation to both sides.','x + 4 = 9 → subtract 4 from both sides → x = 5','If x + 7 = 12, what is x?',['19','7','5'],2,'Subtract 7 from 12 to isolate x: x = 5.'),
lesson('Order of operations','Do multiplication before addition unless parentheses tell you otherwise.','2 + 3 × 4 = 2 + 12 = 14','What is 5 + 2 × 3?',['11','21','15'],0,'Multiply 2 × 3 first, then add 5: the result is 11.') ]},
{id:'science',number:'07',title:'Notice. Question. Discover.',short:'Science lab',subject:'Science',level:'Core concepts',icon:'◉',description:'Understand everyday science with observations and short reasoning challenges.',lessons:[
lesson('States of matter','Solids keep their shape; liquids flow and take the shape of their container; gases spread to fill available space.','Water can be solid ice, liquid water or water vapor.','Which state flows but has a fairly fixed volume?',['Solid','Liquid','Gas'],1,'A liquid changes shape to fit its container while keeping a fairly fixed volume.'),
lesson('The water cycle','Evaporation turns liquid water into water vapor. Condensation turns water vapor into liquid droplets.','Droplets on a cool surface form when water vapor condenses.','What process forms liquid droplets from vapor?',['Melting','Evaporation','Condensation'],2,'Condensation changes gas into liquid.'),
lesson('Plants and light','In photosynthesis, plants use light energy to make sugars from carbon dioxide and water, releasing oxygen.','Light is an energy source; soil is not the source of all plant food.','What provides energy for photosynthesis?',['Light','Plastic','Sound'],0,'Plants capture light energy to help make sugars.'),
lesson('Forces change motion','A force is a push or pull. An unbalanced force can change an object’s speed or direction.','Pushing a still toy car can start it moving.','Which action applies a force?',['Looking at a car','Pushing a car','Naming a car'],1,'Pushing is a force acting on the car.'),
lesson('Food chains','A food chain shows how energy passes between organisms. Producers, such as green plants, capture energy to make food.','Grass → rabbit → fox','Which organism is the producer?',['Fox','Rabbit','Grass'],2,'Grass makes its own food through photosynthesis and starts this food chain.'),
lesson('A fair comparison','To test how light affects plant growth, vary the light while keeping other important conditions similar.','Use the same plant type, water amount and growing time.','Which should you change in this test?',['Amount of light','Everything at once','Plant type and water together'],0,'Changing the factor you want to test while controlling others makes the comparison more useful.') ]},
{id:'habits',number:'08',title:'Build a habit that lasts',short:'Learning habits',subject:'Life skills',level:'Everyday practice',icon:'↗',description:'Practice small, useful choices for focus, teamwork and independent learning.',lessons:[
lesson('Start small','A small action that you can repeat is a useful start to a learning routine.','“After breakfast, I will review one word.”','Which plan is easiest to start consistently?',['Study everything today','Review one word after breakfast','Wait for a perfect day'],1,'A specific small action lowers the effort needed to begin.'),
lesson('Name the next step','A large task becomes easier to approach when you choose one concrete next action.','Instead of “finish science,” try “read the first paragraph.”','Which is a concrete next step?',['Be perfect','Know everything','Read one paragraph'],2,'A concrete action tells you exactly what to do next.'),
lesson('Focus on what you control','You cannot control every event, but you can choose some of your responses.','If a task is difficult, you can ask a question or try a smaller step.','Which response is within your control?',['Ask for an explanation','Make time stop','Control everyone’s thoughts'],0,'Asking a question is an action you can choose.'),
lesson('Listen to understand','Before replying, check whether you understand the other person’s idea.','“Do you mean we should test one example first?”','Which response shows careful listening?',['Interrupt immediately','Restate the idea and check','Ignore the question'],1,'Restating and checking helps avoid misunderstanding.'),
lesson('Work together','Good teamwork uses different strengths and clear responsibilities.','One learner reads instructions; another checks the steps. Both discuss the result.','Which plan supports teamwork?',['One person does everything','Everyone hides their work','Share roles and compare ideas'],2,'Shared roles and discussion let people contribute and learn together.'),
lesson('Reflect and return','After practice, notice one thing that improved and one thing to try next time. Rest also supports sustainable learning.','“I understood fractions better. Tomorrow I will try another example.”','Which is a useful reflection?',['Name a gain and a next step','Only count mistakes','Never revisit the work'],0,'Reflection connects today’s experience with a practical next action.') ]}
];
</script><script>'use strict';
const KEY='learning-grove.v1';
const main=document.getElementById('main');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
let state={completed:[],review:[],days:[],last:null};let saveWarning=false;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.completed)&&Array.isArray(saved.review)&&Array.isArray(saved.days))state={...state,...saved};}catch(e){saveWarning=true;}
const validKeys=new Set(STATIONS.flatMap(s=>s.lessons.map((_,i)=>`${s.id}/${i}`)));
state.completed=[...new Set(state.completed.filter(k=>validKeys.has(k)))];state.review=[...new Set(state.review.filter(k=>validKeys.has(k)))];state.days=[...new Set(state.days.filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)))];if(!validKeys.has(state.last))state.last=null;
const count=s=>state.completed.filter(k=>k.startsWith(s.id+'/')).length;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){saveWarning=true;notify('Storage is unavailable. Progress will last only while this page stays open.');}}
function notify(text){const t=document.getElementById('toast');t.className='toast';t.textContent=text;clearTimeout(notify.timer);notify.timer=setTimeout(()=>{t.className='';t.textContent='';},5000);}
function streak(){const dates=new Set(state.days);let d=new Date();if(!dates.has(today()))d.setDate(d.getDate()-1);let n=0;while(dates.has(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)){n++;d.setDate(d.getDate()-1);}return n;}
function card(s){return `<a class="card" href="#station/${s.id}"><div class="card-top"><span class="icon" aria-hidden="true">${s.icon}</span><span class="num">PATH ${s.number}</span></div><h3>${s.short}</h3><p>${s.description}</p><div class="card-foot"><span>${count(s)}/6 complete</span><span aria-hidden="true">Explore ↗</span></div></a>`;}
function home(){main.innerHTML=`<section class="hero"><div><p class="eyebrow">A place for curious minds</p><h1>Small steps.<br><em>New discoveries.</em></h1><p class="lead">Find your next “I get it!” moment. Explore eight friendly learning paths, with clear English guidance all the way.</p><div class="actions"><a class="btn" href="${state.last?'#lesson/'+state.last:'#station/characters'}">${state.last?'Continue learning':'Start exploring'} <span aria-hidden="true">↗</span></a><a class="btn secondary" href="#passport">Your learning passport</a></div></div><div class="hero-art" aria-label="Eight paths, one curious you"><div class="orbit"><div class="orb-core"><strong>8</strong><span>LEARNING PATHS</span></div></div><span class="floating a">A small step counts.</span><span class="floating b">One curious you. Endless possibility.</span><span class="spark" aria-hidden="true">✳</span></div></section><div class="ribbon"><span>English-first learning</span><span>48 short lessons</span><span>No account needed</span><span>Go at your own pace</span></div><section aria-labelledby="paths-title"><div class="section-head"><div><p class="eyebrow">Follow your curiosity</p><h2 id="paths-title">Where will you begin?</h2></div><p class="subtle">A few minutes can take you somewhere new.</p></div><div class="filters" role="group" aria-label="Filter paths">${['All paths','Chinese','Reading','English','Math','Science','Life skills'].map((x,i)=>`<button class="filter ${i===0?'active':''}" data-filter="${x}" aria-pressed="${i===0}">${x}</button>`).join('')}</div><div class="grid" id="paths">${STATIONS.map(card).join('')}</div></section><section class="passport-banner"><div><p class="eyebrow" style="color:#dedbc9">Your learning passport</p><h2>Collect moments of progress.</h2><p>Finish a path, earn a stamp, and watch your small steps add up.</p></div><a class="btn" href="#passport">Open my passport ↗</a></section>`;main.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{main.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b));});document.getElementById('paths').innerHTML=STATIONS.filter(s=>b.dataset.filter==='All paths'||s.subject===b.dataset.filter).map(card).join('');}));}
function station(s){main.innerHTML=`<a class="back" href="#home">← All learning paths</a><section class="station-hero"><div><p class="eyebrow">Path ${s.number} / ${s.subject}</p><h1>${s.title}</h1><p class="lead">${s.description}</p><span class="tag">${s.level} · 6 mini-lessons</span><div class="progress-track" role="progressbar" aria-label="Path completion" aria-valuenow="${count(s)}" aria-valuemin="0" aria-valuemax="6"><span style="width:${count(s)/6*100}%"></span></div><p class="subtle">${count(s)} of 6 lessons complete. A correct practice answer completes a lesson.</p></div><div class="station-badge" aria-hidden="true">${s.icon}</div></section><div class="lesson-list">${s.lessons.map((l,i)=>`<a class="lesson-row" href="#lesson/${s.id}/${i}"><span class="lesson-index">${state.completed.includes(s.id+'/'+i)?'✓':String(i+1).padStart(2,'0')}</span><div><h3>${l.title}</h3><small>${state.completed.includes(s.id+'/'+i)?'Completed · revisit anytime':'Read · try · understand'}</small></div><span class="arrow" aria-hidden="true">↗</span></a>`).join('')}</div><p class="practice-warning">These are original introductory lessons, not the full curriculum of the earlier linked websites.</p>`;}
function renderLesson(s,i){const l=s.lessons[i],key=s.id+'/'+i;state.last=key;save();main.innerHTML=`<div class="learning-layout"><a class="back" href="#station/${s.id}">← ${s.short}</a><div class="lesson-header"><span>PATH ${s.number} · LESSON ${i+1} OF 6</span><span>${state.completed.includes(key)?'✓ Completed':'One small step'}</span></div><h1>${l.title}</h1><section class="reading" aria-label="Lesson explanation"><p>${l.concept}</p><div class="example"><strong>See it in action</strong>${l.example}</div></section><section class="question" aria-labelledby="question-title"><p class="eyebrow">Give it a try</p><h2 id="question-title">${l.question}</h2><div class="choices">${l.choices.map((c,n)=>`<button class="choice" data-answer="${n}"><span aria-hidden="true">${'ABC'[n]}</span>${c}</button>`).join('')}</div><div class="feedback" id="feedback" role="status" aria-live="polite"></div></section><div class="next-row"><button class="text-link" id="bookmark">${state.review.includes(key)?'Remove from my review':'Save for another look'}</button><a class="btn secondary" href="${i<5?'#lesson/'+s.id+'/'+(i+1):'#passport'}">${i<5?'Next lesson →':'View my passport →'}</a></div><p class="practice-warning">Read at your own pace. You can retry any question. Completing a lesson counts once, even if you practice it again.</p></div>`;
main.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{const correct=Number(b.dataset.answer)===l.answer;const f=document.getElementById('feedback');if(correct){b.classList.add('correct');main.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);if(!state.completed.includes(key))state.completed.push(key);if(!state.days.includes(today()))state.days.push(today());state.review=state.review.filter(k=>k!==key);save();f.innerHTML=`<h3>✓ You’ve got it.</h3><p>${l.explanation}</p>${count(s)===6?'<p><strong>Path complete! A new stamp is waiting in your passport.</strong></p>':''}`;document.getElementById('bookmark').textContent='Save for another look';}else{b.classList.add('incorrect');b.disabled=true;if(!state.review.includes(key))state.review.push(key);save();document.getElementById('bookmark').textContent='Remove from my review';f.innerHTML='<h3>Not quite — take another look.</h3><p>Revisit the explanation above, then try another answer. This lesson is saved in My review.</p>';}}));document.getElementById('bookmark').addEventListener('click',e=>{const exists=state.review.includes(key);state.review=exists?state.review.filter(k=>k!==key):[...state.review,key];save();e.target.textContent=exists?'Save for another look':'Remove from my review';notify(exists?'Removed from your review list.':'Saved in My review.');});}
function review(){main.innerHTML=`<p class="eyebrow">Make it stick</p><h1>A second look<br><em>can change everything.</em></h1><p class="lead">Lessons you saved, plus questions you have not answered correctly yet. A correct answer clears the lesson from this list.</p>${state.review.length?`<div class="lesson-list">${state.review.map(k=>{const[id,i]=k.split('/'),s=STATIONS.find(s=>s.id===id);return `<a class="lesson-row" href="#lesson/${k}"><span class="lesson-index" aria-hidden="true">↻</span><div><h3>${s.lessons[+i].title}</h3><small>${s.short}</small></div><span class="arrow" aria-hidden="true">↗</span></a>`;}).join('')}</div>`:'<div class="empty"><h2>A fresh page.</h2><p class="subtle">Nothing to review yet. Save any lesson for later as you explore.</p><div class="actions" style="justify-content:center"><a class="btn" href="#home">Explore the paths ↗</a></div></div>'}`;}
function passport(){const stamps=STATIONS.filter(s=>count(s)===6).length;main.innerHTML=`<p class="eyebrow">Your personal collection</p><h1>Every small step<br><em>leaves a mark.</em></h1><p class="lead">This is your learning passport. Complete the six lessons in a path to collect its stamp.</p><div class="stat-grid"><div class="stat"><strong>${state.completed.length}<small style="font-size:17px"> / 48</small></strong><span>Lessons completed</span></div><div class="stat"><strong>${stamps}<small style="font-size:17px"> / 8</small></strong><span>Path stamps earned</span></div><div class="stat"><strong>${streak()}</strong><span>Day learning streak</span></div></div><div class="note"><strong>${state.days.includes(today())?'✓ You took a learning step today.':'Today’s small mission'}</strong><br>${state.days.includes(today())?'You can keep exploring or return tomorrow.':'Read one lesson and answer its practice question correctly. A repeat practice counts toward your daily streak too.'}</div><div class="section-head"><h2>Your path stamps</h2><p class="subtle">All eight are waiting for you.</p></div><div class="stamp-grid">${STATIONS.map(s=>`<a class="stamp ${count(s)===6?'earned':''}" href="#station/${s.id}" style="text-decoration:none"><div class="icon" aria-hidden="true">${s.icon}</div><h3>${s.short}</h3><p>${count(s)===6?'✓ Stamp earned':count(s)+'/6 lessons complete'}</p></a>`).join('')}</div><div class="note"><strong>Your progress belongs to this browser.</strong><br>No account or cloud sync is used. Clearing browser data removes this passport. Download a backup to keep it, or restore a backup on another device.${saveWarning?'<br><strong>Browser storage is unavailable. Please download a backup before closing this page.</strong>':''}</div><div class="actions"><button class="btn secondary" id="export">Download progress backup</button><label class="btn secondary" for="import">Restore a backup</label><input class="visually-hidden" type="file" id="import" accept="application/json,.json"><button class="text-link" id="reset">Reset my progress</button></div>`;document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='learning-grove-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Progress backup downloaded.');};document.getElementById('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error();const x=JSON.parse(await file.text());if(x.version!==1||!['completed','review','days'].every(k=>Array.isArray(x[k])&&x[k].every(v=>typeof v==='string'))||!x.completed.every(k=>validKeys.has(k))||!x.review.every(k=>validKeys.has(k))||!x.days.every(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)))throw Error();state={completed:[...new Set([...state.completed,...x.completed])],review:[...new Set([...state.review,...x.review])],days:[...new Set([...state.days,...x.days])],last:validKeys.has(x.last)?x.last:state.last};save();passport();notify('Backup restored. Existing progress was kept.');}catch(e){notify('This is not a valid Learning Grove progress backup.');}};document.getElementById('reset').onclick=()=>{if(confirm('Reset all Learning Grove progress in this browser? Download a backup first if you want to keep it.')){state={completed:[],review:[],days:[],last:null};save();passport();notify('Your passport is ready for a fresh start.');}};}
function about(){main.innerHTML=`<div class="learning-layout"><p class="eyebrow">About Learning Grove</p><h1>Made for learners<br><em>who start in English.</em></h1><div class="reading"><p>This independent learning website offers 48 original introductory mini-lessons across eight paths, plus a local learning passport.</p><p>Navigation, instructions, questions, feedback and progress tools are in English. Chinese appears only as learning material, with pinyin and English meanings. You do not need to read Chinese to use the interface.</p><p>This is a new starter curriculum inspired by the subject areas of the earlier Wanyao directory. It does not reproduce the external websites’ full question banks, stories, accounts, online battles or cloud services. Your existing progress on those sites is separate.</p><p>The palette is based on <a href="https://nipponcolors.com/#rokohcha" target="_blank" rel="noopener">ROKOHCHA / #74673E</a>, paired with warm paper and soft sage colors.</p><p>No analytics or third-party video embeds are included. Progress is stored in this browser, with optional backup and restore.</p><a class="btn" href="#home">Find a learning path ↗</a></div></div>`;}
function route(){const parts=location.hash.slice(1).split('/'),view=parts[0]||'home';if(view==='main'){main.focus();return;}document.querySelectorAll('[data-nav]').forEach(a=>{const active=a.dataset.nav===view||(a.dataset.nav==='home'&&['station','lesson'].includes(view));a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});if(view==='passport')passport();else if(view==='review')review();else if(view==='about')about();else if(view==='station'||view==='lesson'){const s=STATIONS.find(s=>s.id===parts[1]);const i=Number(parts[2]);if(!s||(view==='lesson'&&(!Number.isInteger(i)||i<0||i>=s.lessons.length)))home();else if(view==='station')station(s);else renderLesson(s,i);}else home();document.title=(main.querySelector('h1')?.innerText.replace(/\s+/g,' ').trim()||'Explore')+' — Learning Grove';window.scrollTo(0,0);main.focus({preventScroll:true});}
window.addEventListener('hashchange',route);route();
</script></body></html>
